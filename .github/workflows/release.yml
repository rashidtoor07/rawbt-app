name: Signed Release

# Push a tag like v1.0.0 to publish a GitHub Release with the signed APK and AAB,
# or run this workflow by hand from the Actions tab to just download the files.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets under Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/btprint-release.jks
          # PKCS12 keystores use the same password for the store and the key
          printf 'storeFile=btprint-release.jks\nstorePassword=%s\nkeyAlias=btprint\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > app/keystore.properties

      - name: Set version
        run: |
          # Play requires a higher versionCode on every upload
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Build signed APK and App Bundle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Verify signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Collect files
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/BTPrint-$VERSION_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/BTPrint-$VERSION_NAME.aab"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: btprint-release-${{ env.VERSION_NAME }}
          path: dist/*

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Remove signing key
        if: always()
        run: rm -f app/btprint-release.jks app/keystore.properties
